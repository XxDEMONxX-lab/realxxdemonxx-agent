name: Agent checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run regression tests
        run: npm test
      - name: Smoke-test module imports
        run: node --input-type=module -e "await Promise.all(['./src/core.js','./src/config.js','./src/ui.js','./src/providers.js','./src/tools.js','./src/workspace.js','./src/subagents.js','./src/mcp.js','./src/mcp-http.js','./src/research.js','./src/git-worktree.js','./src/ast.js','./src/skills.js','./src/diagnostics.js','./src/security.js','./src/mcp-catalog.js','./src/agent.js'].map((file)=>import(file))); console.log('Module imports OK')"
