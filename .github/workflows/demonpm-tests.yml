name: demonpm tests
on:
  push:
    paths:
      - "demonpm/**"
      - ".github/workflows/demonpm-tests.yml"
  pull_request:
    paths:
      - "demonpm/**"
      - ".github/workflows/demonpm-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m compileall -q demonpm
      - run: python3 -m unittest discover -s demonpm/tests -v
